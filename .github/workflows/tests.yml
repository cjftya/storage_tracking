name: Windows and Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install system Python, Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 python3-tk xvfb xauth
      - name: Require a working Tk display
        run: |
          /usr/bin/python3 --version
          xvfb-run -a /usr/bin/python3 -c 'import tkinter as tk; root = tk.Tk(); print("Tk", root.tk.call("info", "patchlevel")); root.destroy()'
      - name: Run full suite with real Linux Tk widgets
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: /usr/bin/python3 -m compileall -q storage_scanner tests benchmarks
      - name: Compare file scan and real Tk timings against v1.2 main
        run: xvfb-run -a /usr/bin/python3 -m benchmarks.compare_versions --baseline-ref acc2c9ff2735363c60ec8e8e6acce06678cdb3b6 --entries 3000 --repeat 3 --output benchmarks/results/stability-ci.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require a working Tk display
        run: |
          python --version
          python -c "import tkinter as tk; root = tk.Tk(); print('Tk', root.tk.call('info', 'patchlevel')); root.destroy()"
      - name: Run full suite with real Windows Tk widgets
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q storage_scanner tests benchmarks
      - name: Compare file scan and real Tk timings against v1.2 main
        run: python -m benchmarks.compare_versions --baseline-ref acc2c9ff2735363c60ec8e8e6acce06678cdb3b6 --entries 3000 --repeat 3 --output benchmarks/results/stability-ci.json
